[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-os"
version = "0.1.0"
description = "Research OS control-plane package (Core, Research, Application, Data, Platform ports, Interface)."
readme = "docs/README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0,<3",
    "psycopg[binary]>=3.1.0,<4",
    "alembic>=1.13.0,<2",
    "jsonschema>=4.18.0,<5",
    "referencing>=0.30.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_os"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/research_os",
    "/docs/README.md",
]
